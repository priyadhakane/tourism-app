<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hotels</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f5f5f5;
}

.card img {
    height: 200px;
    object-fit: cover;
}

.map-frame {
    border-radius: 10px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand">🏨 Tourism Hotels</a>
        <div>
			<a href="home.html" class="btn btn-success me-2">🏠 Home</a>
            <a href="places.html" class="btn btn-light">Back</a>
            <button class="btn btn-warning ms-2" onclick="viewBookings()">My Bookings</button>
        </div>
    </div>
</nav>

<!-- SEARCH -->
<div class="container mt-4 text-center">
    <input type="text" id="searchInput" onkeyup="searchHotels()" 
        placeholder="Search hotels..." class="form-control w-50 mx-auto">
</div>

<p id="noResults" class="text-center text-danger mt-3"></p>

<!-- HOTELS -->
<div class="container">
    <div class="row mt-4" id="hotelContainer"></div>
</div>

<!-- 🏨 HOTEL DETAILS MODAL -->
<div class="modal fade" id="hotelModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">

      <h3 id="hName"></h3>

      <img id="hImage" class="img-fluid mb-3">

      <p><b>Location:</b> <span id="hLocation"></span></p>
      <p><b>Near:</b> <span id="hPlace"></span></p>
      <p><b>Price:</b> ₹<span id="hPrice"></span></p>
      <p><b>Speciality:</b> <span id="hSpecial"></span></p>
      <p><b>Description:</b> <span id="hDesc"></span></p>

      <!-- MAP -->
      <iframe id="hMap" width="100%" height="250" class="map-frame"></iframe>

      <!-- BUTTONS -->
      <button class="btn btn-success mt-3 w-100" onclick="confirmBooking()">
          Confirm Booking
      </button>

      <button class="btn btn-primary mt-2 w-100" onclick="openDirections()">
          📍 Get Directions
      </button>

      <button class="btn btn-danger mt-2 w-100" data-bs-dismiss="modal">Close</button>

    </div>
  </div>
</div>

<!-- 📋 BOOKINGS MODAL -->
<div class="modal fade" id="bookingModal">
  <div class="modal-dialog">
    <div class="modal-content p-3">

      <h4>📋 My Bookings</h4>

      <ul id="bookingList" class="list-group"></ul>

      <button class="btn btn-danger mt-3" data-bs-dismiss="modal">Close</button>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

let selectedHotel = "";
let selectedLocation = "";

// LOAD HOTELS
function loadHotels() {

    let selectedPlace = localStorage.getItem("selectedPlace");

    let url = "http://localhost:9090/hotels";

    if (selectedPlace) {
        url = "http://localhost:9090/hotels/" + selectedPlace;
    }

    fetch(url)
    .then(res => res.json())
    .then(data => showHotels(data));
}

// SHOW HOTELS
function showHotels(data) {

    let container = document.getElementById("hotelContainer");
    let noResults = document.getElementById("noResults");

    container.innerHTML = "";
    noResults.innerHTML = "";

    if (data.length === 0) {
        noResults.innerHTML = "❌ No hotels found";
        return;
    }

    data.forEach(hotel => {

        container.innerHTML += `
        <div class="col-md-4 mb-4">
            <div class="card shadow">

                <img src="https://source.unsplash.com/300x200/?hotel">

                <div class="card-body">

                    <h5>${hotel.name}</h5>
                    <p>${hotel.location}</p>
                    <p>₹${hotel.price}</p>

                    <button class="btn btn-success w-100"
                        onclick='showHotelDetails(${JSON.stringify(hotel)})'>
                        View Details
                    </button>

                </div>

            </div>
        </div>
        `;
    });
}

// SHOW HOTEL DETAILS
function showHotelDetails(hotel) {

    selectedHotel = hotel.name;
    selectedLocation = hotel.location;

    document.getElementById("hName").innerText = hotel.name;
    document.getElementById("hLocation").innerText = hotel.location;
    document.getElementById("hPlace").innerText = hotel.placeName;
    document.getElementById("hPrice").innerText = hotel.price;

    document.getElementById("hSpecial").innerText =
        hotel.speciality || "Comfortable stay with good facilities";

    document.getElementById("hDesc").innerText =
        hotel.description || "Clean rooms, friendly staff and good service.";

    document.getElementById("hImage").src =
        hotel.imageUrl || "https://source.unsplash.com/600x300/?hotel,room";

    document.getElementById("hMap").src =
        "https://www.google.com/maps?q=" + hotel.location + "&output=embed";

    let modal = new bootstrap.Modal(document.getElementById('hotelModal'));
    modal.show();
}

// CONFIRM BOOKING
function confirmBooking() {

    let user = localStorage.getItem("user");

    if (!user) {
        alert("Please login first!");
        window.location.href = "login.html";
        return;
    }

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    bookings.push({
        hotel: selectedHotel,
        location: selectedLocation,
        date: new Date().toLocaleString()
    });

    localStorage.setItem("bookings", JSON.stringify(bookings));

    alert("Hotel booked successfully 🎉");
}

// VIEW BOOKINGS
function viewBookings() {

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];
    let list = document.getElementById("bookingList");

    list.innerHTML = "";

    if (bookings.length === 0) {
        list.innerHTML = "<li class='list-group-item'>No bookings yet</li>";
    } else {
        bookings.forEach(b => {
            list.innerHTML += `
                <li class="list-group-item">
                    <b>${b.hotel}</b><br>
                    ${b.location}<br>
                    <small>${b.date}</small>
                </li>
            `;
        });
    }

    let modal = new bootstrap.Modal(document.getElementById('bookingModal'));
    modal.show();
}

// SEARCH
function searchHotels() {

    let keyword = document.getElementById("searchInput").value.toLowerCase();

    fetch("http://localhost:9090/hotels")
    .then(res => res.json())
    .then(data => {

        let filtered = data.filter(h =>
            h.name.toLowerCase().includes(keyword) ||
            h.location.toLowerCase().includes(keyword) ||
            h.placeName.toLowerCase().includes(keyword)
        );

        showHotels(filtered);
    });
}

// GOOGLE DIRECTIONS
function openDirections() {

    let url = "https://www.google.com/maps/dir/?api=1&destination="
        + encodeURIComponent(selectedLocation);

    window.open(url, "_blank");
}

window.onload = loadHotels;

</script>

</body>
</html>
