<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tourism Places</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f5f5f5;
}

.card img {
    height: 200px;
    object-fit: cover;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand">🌿 Jharkhand Tourism</a>
		<div>
			<a href="home.html" class="btn btn-success me-2">🏠 Home</a>
        <a href="hotels.html" class="btn btn-light">View Hotels</a>
    </div>
	</div>
</nav>

<!-- SEARCH + FILTER -->
<div class="container mt-4 text-center">

    <h3 class="mb-3 text-success">Explore Tourist Places</h3>

    <input type="text" id="searchBox"
        onkeyup="searchPlaces()"
        placeholder="Search places, location..."
        class="form-control w-50 mx-auto mb-3">

    <button class="btn btn-success" onclick="filterPlaces('Eco')">Eco</button>
    <button class="btn btn-warning" onclick="filterPlaces('Cultural')">Cultural</button>
    <button class="btn btn-dark" onclick="loadPlaces()">All</button>

</div>

<p id="noResults" class="text-center text-danger mt-3"></p>

<!-- PLACES -->
<div class="container">
    <div class="row mt-4" id="placesContainer"></div>
</div>

<!-- DETAILS MODAL -->
<div class="modal fade" id="placeModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">

      <h3 id="mName"></h3>

      <img id="mImage" class="img-fluid mb-3">

      <p><b>Location:</b> <span id="mLocation"></span></p>
      <p><b>Category:</b> <span id="mCategory"></span></p>
      <p><b>Description:</b> <span id="mDesc"></span></p>
      <p><b>Speciality:</b> <span id="mSpeciality"></span></p>
      <p><b>History:</b> <span id="mHistory"></span></p>

      <!-- 🔥 MAP SECTION -->
      <h5 class="mt-3">📍 Location Map</h5>

      <iframe id="mapFrame"
              width="100%"
              height="300"
              style="border:0; border-radius:10px;">
      </iframe>

      <!-- 🔥 DIRECTIONS BUTTON -->
      <button class="btn btn-primary mt-3" onclick="openDirections()">
          📍 Get Directions
      </button>

      <button class="btn btn-danger mt-2" data-bs-dismiss="modal">Close</button>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// 🔥 GLOBAL VARIABLE
let selectedPlaceName = "";

// LOAD PLACES
function loadPlaces() {
    fetch("http://localhost:9090/places")
    .then(res => res.json())
    .then(data => showPlaces(data));
}

// SHOW PLACES
function showPlaces(data) {

    let container = document.getElementById("placesContainer");
    let noResults = document.getElementById("noResults");

    container.innerHTML = "";
    noResults.innerHTML = "";

    if (data.length === 0) {
        noResults.innerHTML = "❌ No places found";
        return;
    }

    data.forEach(place => {

        container.innerHTML += `
        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <img src="${place.imageUrl}"
                     onclick='showDetails(${JSON.stringify(place)})'>

                <div class="card-body">

                    <h5>${place.name}</h5>
                    <p>${place.location}</p>

                    <button class="btn btn-success"
                        onclick="bookPlace('${place.name}')">
                        View Hotels
                    </button>

                </div>

            </div>

        </div>
        `;
    });
}

// DETAILS POPUP + MAP
function showDetails(place) {

    selectedPlaceName = place.name + ", " + place.location;

    document.getElementById("mName").innerText = place.name;
    document.getElementById("mImage").src = place.imageUrl;
    document.getElementById("mLocation").innerText = place.location;
    document.getElementById("mCategory").innerText = place.category;
    document.getElementById("mDesc").innerText = place.description;
    document.getElementById("mSpeciality").innerText = place.speciality;
    document.getElementById("mHistory").innerText = place.history;

    // 🔥 SET MAP
    document.getElementById("mapFrame").src =
        "https://www.google.com/maps?q=" + place.location + "&output=embed";

    let modal = new bootstrap.Modal(document.getElementById('placeModal'));
    modal.show();
}

// SEARCH
function searchPlaces() {

    let keyword = document.getElementById("searchBox").value.toLowerCase();

    fetch("http://localhost:9090/places")
    .then(res => res.json())
    .then(data => {

        let filtered = data.filter(place =>
            place.name.toLowerCase().includes(keyword) ||
            place.location.toLowerCase().includes(keyword) ||
            place.category.toLowerCase().includes(keyword)
        );

        showPlaces(filtered);
    });
}

// FILTER
function filterPlaces(category) {

    fetch("http://localhost:9090/places")
    .then(res => res.json())
    .then(data => {

        let filtered = data.filter(p => p.category === category);
        showPlaces(filtered);
    });
}

// 🔥 GOOGLE MAP DIRECTIONS
function openDirections() {

    if (!selectedPlaceName) {
        alert("Place not selected!");
        return;
    }

    let url = "https://www.google.com/maps/dir/?api=1&destination="
        + encodeURIComponent(selectedPlaceName);

    window.open(url, "_blank");
}

// REDIRECT TO HOTELS
function bookPlace(placeName) {

    localStorage.setItem("selectedPlace", placeName);
    window.location.href = "hotels.html";
}

window.onload = loadPlaces;

</script>

</body>
</html>
